services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://plmiq:plmiq@postgres:5432/plmiq}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      TENANT_REQUIRE_SUBDOMAIN: ${TENANT_REQUIRE_SUBDOMAIN:-false}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uv_cache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      gitea:
        condition: service_healthy
      smtp:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plmiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plmiq}
      POSTGRES_DB: ${POSTGRES_DB:-plmiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-elastic}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  gitea:
    image: gitea/gitea:${GITEA_VERSION:-1.22}
    restart: unless-stopped
    environment:
      USER_UID: "${GITEA_UID:-1000}"
      USER_GID: "${GITEA_GID:-1000}"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA_BASE_URL:-http://localhost:3000}/
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  smtp:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: plm-iq-dev-network

volumes:
  postgres_dev_data:
  elasticsearch_dev_data:
  gitea_dev_data:
  mailpit_dev_data:
  uv_cache:
