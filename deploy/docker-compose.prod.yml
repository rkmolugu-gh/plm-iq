# ─────────────────────────────────────────────────────────────────────────
# PLM-IQ production overlay.
#
# Layers the application API and the Caddy TLS reverse proxy on top of the
# infra services defined in the root docker-compose.yml. Use both files:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Required environment (secrets, provisioned in the prod environment, NOT in
# the committed .env):
#   ACME_EMAIL           - Let's Encrypt contact
#   CLOUDFLARE_API_TOKEN - Cloudflare zone-scoped token (Zone -> DNS -> Edit)
#
# Production BASE_DOMAIN MUST be "discreet.plm-iq.com" so the Caddy tenant
# wildcard (*.discreet.plm-iq.com) resolves tenants (see deploy/Caddyfile
# and app/routers/auth.py resolve_tenant).
# ─────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      gitea:
        condition: service_healthy
      smtp:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      # Persist the SQLite DB and app data across container rebuilds.
      # (Postgres is provisioned for a future DB migration; the app still
      # runs on SQLite until a driver is added to pyproject.toml and
      # DATABASE_URL is switched to postgres.)
      - ../db:/app/db
      - ../data:/app/data
    networks:
      - default

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required (Let's Encrypt contact)}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN required (Cloudflare Zone DNS Edit)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certs, storage, access logs
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - default

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-plm-iq-network}

volumes:
  caddy_data:
  caddy_config:
