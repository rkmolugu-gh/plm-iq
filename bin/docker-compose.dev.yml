# PLM-IQ development stack (api + infra). Runs on SQLite (no Postgres).
# Run via: bin/buildrun.bat dev build / dev run
services:
  api:
    build:
      context: ${PLMIQ_ROOT}
      dockerfile: bin/Dockerfile.dev
    restart: unless-stopped
    env_file: ${PLMIQ_ROOT}/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///db/plm-iq.db}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      TENANT_REQUIRE_SUBDOMAIN: ${TENANT_REQUIRE_SUBDOMAIN:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${PLMIQ_ROOT}:/app
    depends_on:
      elasticsearch:
        condition: service_healthy
      gitea:
        condition: service_healthy
      smtp:
        condition: service_healthy

  gitea:
    image: gitea/gitea:${GITEA_VERSION:-1.22}
    restart: unless-stopped
    environment:
      USER_UID: "${GITEA_UID:-1000}"
      USER_GID: "${GITEA_GID:-1000}"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA_BASE_URL:-http://localhost:3000}/
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - "${GITEA_DATA_DIR:-${PLMIQ_ROOT}/data/gitea}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${ES_PASSWORD:-elastic}"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - "${ELASTICSEARCH_DATA_DIR:-${PLMIQ_ROOT}/data/elasticsearch}:/usr/share/elasticsearch/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  smtp:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - "${MAILPIT_DATA_DIR:-${PLMIQ_ROOT}/data/mailpit}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-plm-iq-network}
