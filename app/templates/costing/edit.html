{% extends "base.html" %}
{% block title %}Edit Costing #{{ item.id }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/costing">Costing</a></li>
        <li class="breadcrumb-item"><a href="/costing/{{ item.id }}">#{{ item.id }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Costing Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/costing/{{ item.id }}/edit">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Material Cost</label>
                    <input type="number" step="0.0001" name="material_cost" class="form-control" value="{{ item.material_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Labor Cost</label>
                    <input type="number" step="0.0001" name="labor_cost" class="form-control" value="{{ item.labor_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Overhead Cost</label>
                    <input type="number" step="0.0001" name="overhead_cost" class="form-control" value="{{ item.overhead_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Machining Cost</label>
                    <input type="number" step="0.0001" name="machining_cost" class="form-control" value="{{ item.machining_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Unit Cost</label>
                    <input type="number" step="0.0001" name="unit_cost" class="form-control" value="{{ item.unit_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Extended Cost</label>
                    <input type="number" step="0.0001" name="extended_cost" class="form-control" value="{{ item.extended_cost }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Rolled Total</label>
                    <input type="number" step="0.0001" name="rolled_total" class="form-control" value="{{ item.rolled_total }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cost Type</label>
                    <select name="cost_type" class="form-select">
                        <option value="LEAF" {% if item.cost_type == 'LEAF' %}selected{% endif %}>LEAF</option>
                        <option value="ASSEMBLY" {% if item.cost_type == 'ASSEMBLY' %}selected{% endif %}>ASSEMBLY</option>
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/costing/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
