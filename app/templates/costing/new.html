{% extends "base.html" %}
{% block title %}New Costing Entry - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/costing">Costing</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New Costing Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/costing/new">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Part Name</label>
                    <input type="text" name="part_name" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Level</label>
                    <input type="number" name="level" class="form-control" value="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Qty</label>
                    <input type="number" name="qty" class="form-control" value="1">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Material Cost</label>
                    <input type="number" step="0.0001" name="material_cost" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Labor Cost</label>
                    <input type="number" step="0.0001" name="labor_cost" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Overhead Cost</label>
                    <input type="number" step="0.0001" name="overhead_cost" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Machining Cost</label>
                    <input type="number" step="0.0001" name="machining_cost" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Unit Cost</label>
                    <input type="number" step="0.0001" name="unit_cost" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cost Type</label>
                    <select name="cost_type" class="form-select">
                        {% for ct in settings.COST_TYPES %}
                        <option value="{{ ct }}">{{ ct }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/costing" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
