{% extends "base.html" %}
{% block title %}Edit {{ part.part_number }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/parts">Parts</a></li>
        <li class="breadcrumb-item"><a href="/parts/{{ part.part_number }}">{{ part.part_number }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit {{ part.part_number }}</h5>
    <form method="POST" action="/favorites/{% if is_favorite %}remove{% else %}add{% endif %}" class="d-inline">
        <input type="hidden" name="object_type" value="part">
        <input type="hidden" name="object_id" value="{{ part.part_number }}">
        <button type="submit" class="btn btn-outline-warning btn-sm" title="{% if is_favorite %}Remove from favorites{% else %}Add to favorites{% endif %}">
            <i class="bi bi-star{% if is_favorite %}-fill{% endif %}"></i>
        </button>
    </form>
</div>
    <div class="card-body">
        <form method="POST" action="/parts/{{ part.part_number }}/edit">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Part Name</label>
                    <input type="text" name="part_name" class="form-control" value="{{ part.part_name }}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Revision</label>
                    <input type="text" name="part_revision" class="form-control" value="{{ part.part_revision }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Material</label>
                    <input type="text" name="material" class="form-control" value="{{ part.material or '' }}">
                </div>
                <div class="col-md-1">
                    <label class="form-label">UOM</label>
                    <input type="text" name="uom" class="form-control" value="{{ part.uom }}">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Qty</label>
                    <input type="number" name="qty" class="form-control" value="{{ part.qty }}">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statuses %}
                        <option value="{{ s }}" {% if part.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Spec File</label>
                    <input type="text" name="spec_file" class="form-control" value="{{ part.spec_file or '' }}">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/parts/{{ part.part_number }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
