{% extends "base.html" %}
{% block title %}New Part - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/parts">Parts</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New Part</h5></div>
    <div class="card-body">
        <form method="POST" action="/parts/new">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" placeholder="Auto-generated if blank">
                    <div class="form-text text-secondary">Leave blank to auto-generate from tenant numbering.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Part Name</label>
                    <input type="text" name="part_name" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Revision</label>
                    <input type="text" name="part_revision" class="form-control" value="A" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Material</label>
                    <input type="text" name="material" class="form-control">
                </div>
                <div class="col-md-1">
                    <label class="form-label">UOM</label>
                    <input type="text" name="uom" class="form-control" value="EA">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Qty</label>
                    <input type="number" name="qty" class="form-control" value="1">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statuses %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Spec File</label>
                    <input type="text" name="spec_file" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/parts" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
