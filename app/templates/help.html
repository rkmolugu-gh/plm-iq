{% extends "base.html" %}
{% block title %}Help - PLM-IQ{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-question-circle"></i> Help</h4>
    <a href="/" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>

<div class="card">
    <div class="card-header">
        <i class="bi bi-info-circle"></i> Status Legend
    </div>
    <div class="card-body">
        <div class="d-flex flex-wrap gap-4 align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-flag-fill text-success fs-5"></i>
                <span class="text-muted small">RELEASED</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-flag-fill text-danger fs-5"></i>
                <span class="text-muted small">OBSOLETED</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-flag-fill text-info fs-5"></i>
                <span class="text-muted small">IN_DEVELOPMENT</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-flag fs-5"></i>
                <span class="text-muted small">DRAFT</span>
            </div>
        </div>
    </div>
</div>

{% endblock %}
