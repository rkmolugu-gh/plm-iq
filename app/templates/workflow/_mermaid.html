{# Shared Mermaid helpers for workflow diagrams. Include this once per page that
   needs to draw a workflow. Defines two globals used by the definition form and the
   instance progress view. #}
<style>
  .plm-workflow-legend {
    background: rgba(33, 37, 41, 0.9);
    border: 1px solid #495057;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 1em;
    color: #e9ecef;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
    backdrop-filter: blur(4px);
  }
  .plm-workflow-legend span {
    white-space: nowrap;
  }
  .plm-workflow-legend code {
    background: rgba(255, 255, 255, 0.1);
    padding: 0 3px;
    border-radius: 2px;
    font-size: 0.9em;
  }
  .mermaid-container {
    position: relative;
    display: block;
    width: 100%;
  }
</style>
<script>
  function plmEscapeMermaid(s) {
    return String(s == null ? "" : s)
      .replace(/"/g, "'")
      .replace(/[\r\n]+/g, " ");
  }

  // Build a Mermaid `flowchart TD` string from a workflow definition object.
  // statusByStepKey (optional) maps step name -> "APPROVED"|"PENDING"|"REJECTED"
  // and color-codes the nodes.
  function plmBuildMermaid(def, statusByStepKey) {
    statusByStepKey = statusByStepKey || null;
    var stages = (def && def.stages) ? def.stages : [];
    var lines = ["flowchart TD"];
    if (!stages.length) {
      lines.push('empty["No stages defined"]');
      return lines.join("\n");
    }

    var stageEntries = []; // entry node ids per stage
    var stageExits = [];   // exit node ids per stage
    var hasStartNode = false;
    var hasEndNode = false;

    stages.forEach(function (stage, si) {
      var steps = stage.steps || [];
      var sLabel = plmEscapeMermaid(stage.name || ("Stage " + (si + 1)));

      // Handle start/end stage flags
      if (stage.start) {
        hasStartNode = true;
        sLabel = "Start";
      }
      if (stage.end) {
        hasEndNode = true;
        sLabel = "End";
      }

      if (stage.parallel) {
        sLabel += " [parallel]";
        if (stage.threshold) sLabel += " (" + stage.threshold + " of " + steps.length + ")";
      }
      lines.push('subgraph S' + si + '["' + sLabel + '"]');
      var nodeIds = [];
      steps.forEach(function (step, ti) {
        var nid = "n" + si + "_" + ti;
        var label = plmEscapeMermaid(step.name || ("Step " + (ti + 1)));

        // Build compact step information (no description - will be tooltip)
        var details = [];

        // Parse assignee (new format: "role:xxx" or "user:xxx")
        if (step.assignee) {
          var assigneeInfo = "";
          var assigneeParts = step.assignee.split(":");
          var assigneeType = assigneeParts[0];
          var assigneeValue = assigneeParts.slice(1).join(":");

          if (assigneeType === "role") {
            assigneeInfo = "👥 " + plmEscapeMermaid(assigneeValue);
            // Add quorum info if available (from stage threshold or step-level)
            var quorum = step.quorum || (stage.threshold && stage.parallel ? stage.threshold : null);
            if (quorum) {
              assigneeInfo += " <small>(q:" + quorum + ")</small>";
            }
          } else if (assigneeType === "user") {
            assigneeInfo = "👤 " + plmEscapeMermaid(assigneeValue);
          } else if (assigneeType === "system") {
            assigneeInfo = "⚙️ " + plmEscapeMermaid(assigneeValue);
          } else {
            assigneeInfo = plmEscapeMermaid(step.assignee);
          }
          details.push(assigneeInfo);
        }

        // Add due date
        if (step.due_days) details.push("⏱️" + step.due_days + "d");

        // Add allowed actions
        if (step.allowed_actions && step.allowed_actions.length) {
          details.push("✅ " + step.allowed_actions.join(","));
        }

        // Add notification
        if (step.notification) {
          details.push("📧 " + plmEscapeMermaid(step.notification));
        }

        // Combine details (compact)
        if (details.length) {
          label += "<br/><small>" + details.join(" ") + "</small>";
        }

        var cls = "";
        if (statusByStepKey && step.name && statusByStepKey[step.name]) {
          var st = statusByStepKey[step.name];
          if (st === "APPROVED") cls = ":::done";
          else if (st === "REJECTED") cls = ":::rej";
          else if (st === "PENDING") cls = ":::pend";
        }
        lines.push(nid + '["' + label + '"]' + cls);
        nodeIds.push(nid);

        // Mark nodes that have descriptions (for tooltip addition after render)
        if (step.description) {
          // Store description in global object
          if (!window.plmNodeDescriptions) window.plmNodeDescriptions = {};
          window.plmNodeDescriptions[nid] = step.description;
          // Add a CSS class marker (will be used to find nodes after render)
          lines.push(nid + ':::hasDesc');
        }
      });

      // Sequential stage chains its steps; parallel stage fans them out together.
      if (!stage.parallel && nodeIds.length > 1) {
        for (var i = 0; i < nodeIds.length - 1; i++) {
          lines.push(nodeIds[i] + " --> " + nodeIds[i + 1]);
        }
      }
      lines.push("end");

      if (stage.parallel) {
        stageEntries.push(nodeIds.slice());
        stageExits.push(nodeIds.slice());
      } else {
        stageEntries.push(nodeIds.length ? [nodeIds[0]] : []);
        stageExits.push(nodeIds.length ? [nodeIds[nodeIds.length - 1]] : []);
      }
    });

    // Connect each stage's entries from the previous stage's exits.
    for (var si = 0; si < stages.length; si++) {
      var entries = stageEntries[si];
      var prevExits;
      if (si === 0) {
        // If first stage is a start node, don't add external start
        prevExits = hasStartNode ? [] : ["start"];
      } else {
        prevExits = stageExits[si - 1];
      }

      if (prevExits.length && entries.length) {
        prevExits.forEach(function (from) {
          entries.forEach(function (to) {
            lines.push(from + " --> " + to);
          });
        });
      } else if (entries.length && !hasStartNode && si === 0) {
        // Connect start to first stage if no start node
        lines.push("start --> " + entries[0]);
      }
    }

    // Add start/finish nodes if not present as stages
    if (!hasStartNode) {
      lines.push("start((Start))");
    }
    if (!hasEndNode) {
      stageExits[stageExits.length - 1].forEach(function (nid) {
        lines.push(nid + " --> finish");
      });
      lines.push("finish((Done))");
    } else {
      // Connect last stage to end node (already in the stage)
    }

    if (statusByStepKey) {
      lines.push("classDef done fill:#198754,stroke:#fff,color:#fff;");
      lines.push("classDef pend fill:#ffc107,stroke:#000,color:#000;");
      lines.push("classDef rej fill:#dc3545,stroke:#fff,color:#fff;");
    }
    // Add class for nodes with descriptions
    lines.push("classDef hasDesc stroke-dasharray: 2 2;");

    return lines.join("\n");
  }

  // Build Mermaid diagram with tooltips (stores descriptions for hover)
  window.plmBuildMermaidWithTooltips = function(def, statusByStepKey) {
    // Reset descriptions
    window.plmNodeDescriptions = {};

    return plmBuildMermaid(def, statusByStepKey);
  };

  // Guard to prevent simultaneous renders of the same element.
  var plmRenderPending = new Map();

  // Render Mermaid diagram into a container element. Uses textContent
  // instead of innerHTML to avoid HTML parsing issues that can corrupt
  // Mermaid syntax (e.g. <br/> tags, <small>/<em> elements, HTML-encoded
  // arrows like --> → --&gt;).
  async function plmRenderMermaid(containerEl, text, attempt) {
    if (!containerEl) return;

    // If a render is already pending for this element, cancel it.
    var existingTimer = plmRenderPending.get(containerEl);
    if (existingTimer) {
      clearTimeout(existingTimer);
      plmRenderPending.delete(containerEl);
    }

    attempt = attempt || 0;
    // The shared Mermaid CDN script is loaded at the end of base.html, after
    // page-specific scripts. Wait briefly instead of failing on the first
    // render call while Mermaid is still downloading.
    if (typeof mermaid === "undefined") {
      if (attempt < 120) {
        containerEl.className = "";
        containerEl.innerHTML = '<div class="text-muted small"><i class="bi bi-hourglass-split"></i> Loading workflow diagram…</div>';
        var timer = window.setTimeout(function () {
          plmRenderPending.delete(containerEl);
          plmRenderMermaid(containerEl, text, attempt + 1);
        }, 100);
        plmRenderPending.set(containerEl, timer);
      } else {
        containerEl.className = "";
        containerEl.innerHTML = '<div class="text-warning small">Mermaid failed to load. Check the network connection or CDN access.</div>';
      }
      return;
    }

    // Ensure Mermaid is initialized with correct settings.
    if (mermaid.initialize && !mermaid._plmInitialized) {
      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
      mermaid._plmInitialized = true;
    }

    containerEl.className = "mermaid";
    containerEl.removeAttribute("data-processed");
    containerEl.textContent = text;
    try {
      await mermaid.run({ nodes: [containerEl] });
      // Add compact legend after diagram renders
      plmAddLegend(containerEl);
      // Add hover tooltips to nodes with descriptions
      plmAddHoverTooltips(containerEl);
    } catch (e) {
      containerEl.className = "";
      containerEl.innerHTML =
        '<div class="text-danger small">Cannot render diagram: ' +
        plmEscapeMermaid(e && e.message ? e.message : e) + "</div>";
    }
  }

  // Add a compact legend to the bottom-right of the diagram
  function plmAddLegend(containerEl) {
    if (!containerEl) return;
    // Remove existing legend if present
    var existing = containerEl.parentNode.querySelector('.plm-workflow-legend');
    if (existing) existing.remove();
    // Create legend element
    var legend = document.createElement('div');
    legend.className = 'plm-workflow-legend';
    legend.innerHTML = '<span>👤=User</span> <span>👥=Role</span> <span>⚙️=System</span> <span>⏱️=Due</span> <span>✅=Actions</span> <span>📧=Notify</span>';
    // Insert after the container
    containerEl.parentNode.appendChild(legend);
  }

  // Store node descriptions globally
  window.plmNodeDescriptions = {};

  // Add hover tooltips to SVG nodes after rendering
  function plmAddHoverTooltips(containerEl) {
    if (!containerEl) return;

    // Find all SVG node elements (Mermaid creates complex SVG structures)
    var svg = containerEl.querySelector('svg');
    if (!svg) return;

    // Find all nodes with hasDesc class (added via classDef)
    var nodes = svg.querySelectorAll('.hasDesc');
    nodes.forEach(function(node) {
      // Get the node ID from the DOM element
      var nodeId = null;
      var id = node.id || '';
      var match = id.match(/n\d+_\d+/);
      if (match) nodeId = match[0];

      if (nodeId && window.plmNodeDescriptions[nodeId]) {
        var description = window.plmNodeDescriptions[nodeId];

        node.addEventListener('mouseenter', function(e) {
          plmShowHoverTooltip(e, description);
        });
        node.addEventListener('mouseleave', function() {
          plmHideHoverTooltip();
        });
      }
    });
  }

  // Show hover tooltip
  function plmShowHoverTooltip(e, description) {
    var tooltip = document.getElementById('plm-mermaid-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'plm-mermaid-tooltip';
      tooltip.style.cssText = 'position:fixed;background:rgba(0,0,0,0.9);color:#fff;padding:8px 12px;border-radius:4px;font-size:13px;max-width:300px;z-index:9999;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.5);display:none;';
      document.body.appendChild(tooltip);
    }
    tooltip.textContent = description;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  }

  // Hide hover tooltip
  function plmHideHoverTooltip() {
    var tooltip = document.getElementById('plm-mermaid-tooltip');
    if (tooltip) {
      tooltip.style.display = 'none';
    }
  }
</script>
