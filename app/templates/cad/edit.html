{% extends "base.html" %}
{% block title %}Edit {{ item.cad_file_name }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/cad">CAD</a></li>
        <li class="breadcrumb-item"><a href="/cad/{{ item.id }}">{{ item.cad_file_name }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit CAD Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/cad/{{ item.id }}/edit">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">File Name</label>
                    <input type="text" name="cad_file_name" class="form-control" value="{{ item.cad_file_name }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Format</label>
                    <select name="cad_file_format" class="form-select">
                        {% for f in ['SLDASM','SLDPRT','STEP','STP','DWG','DXF','STL','3MF'] %}
                        <option value="{{ f }}" {% if item.cad_file_format == f %}selected{% endif %}>{{ f }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ref Type</label>
                    <select name="file_reference_type" class="form-select">
                        {% for t in ['LocalServer','AWS S3','Git'] %}
                        <option value="{{ t }}" {% if item.file_reference_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CAD System</label>
                    <input type="text" name="cad_system" class="form-control" value="{{ item.cad_system or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">File Size (bytes)</label>
                    <input type="number" name="file_size_bytes" class="form-control" value="{{ item.file_size_bytes or 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Drawing Number</label>
                    <input type="text" name="drawing_number" class="form-control" value="{{ item.drawing_number or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Model Type</label>
                    <input type="text" name="model_type" class="form-control" value="{{ item.model_type or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="3">{{ item.notes or '' }}</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/cad/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
