{% extends "base.html" %}
{% block title %}New CAD Entry - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/cad">CAD</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New CAD Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/cad/new">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">File Name</label>
                    <input type="text" name="cad_file_name" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Format</label>
                    <select name="cad_file_format" class="form-select">
                        {% for f in formats %}
                        <option value="{{ f }}">{{ f }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ref Type</label>
                    <select name="file_reference_type" class="form-select">
                        {% for t in ref_types %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CAD System</label>
                    <input type="text" name="cad_system" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/cad" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
