{% extends "base.html" %}
{% block title %}Edit {{ item.eco_number }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/eco">ECOs</a></li>
        <li class="breadcrumb-item"><a href="/eco/{{ item.eco_number }}">{{ item.eco_number }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit {{ item.eco_number }}</h5>
    <form method="POST" action="/favorites/{% if is_favorite %}remove{% else %}add{% endif %}" class="d-inline">
        <input type="hidden" name="object_type" value="eco">
        <input type="hidden" name="object_id" value="{{ item.eco_number }}">
        <button type="submit" class="btn btn-outline-warning btn-sm" title="{% if is_favorite %}Remove from favorites{% else %}Add to favorites{% endif %}">
            <i class="bi bi-star{% if is_favorite %}-fill{% endif %}"></i>
        </button>
    </form>
</div>
    <div class="card-body">
        <form method="POST" action="/eco/{{ item.eco_number }}/edit">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">ECO Title</label>
                    <input type="text" name="eco_title" class="form-control" value="{{ item.eco_title }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Part</label>
                    <select name="part_number" id="part_number_select" class="form-select">
                        <option value="">Select a part...</option>
                        {% for p in parts %}
                        <option value="{{ p.part_number }}" data-revision="{{ p.part_revision }}" {% if item.part_number == p.part_number %}selected{% endif %}>{{ p.part_number }} Rev {{ p.part_revision }} — {{ p.part_name or p.part_number }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select name="eco_status" class="form-select">
                        {% for s in statuses %}
                        <option value="{{ s }}" {% if item.eco_status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Change Type</label>
                    <select name="change_type" class="form-select">
                        <option value="">(none)</option>
                        {% for ct in change_types %}
                        <option value="{{ ct }}" {% if item.change_type == ct %}selected{% endif %}>{{ ct }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <hr>
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Current Rev</label>
                    <input type="text" name="current_revision" id="current_revision" class="form-control" value="{{ item.current_revision or 'A' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">New Rev</label>
                    <input type="text" name="new_revision" class="form-control" value="{{ item.new_revision or 'B' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">BOM Level</label>
                    <input type="number" name="affected_bom_level" class="form-control" min="0" value="{{ item.affected_bom_level or 0 }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Drafter</label>
                    <select name="change_drafter" class="form-select">
                        <option value="">(none)</option>
                        {% for u in users %}
                        <option value="{{ u.user_id }}" {% if item.change_drafter == u.user_id %}selected{% endif %}>{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Approver</label>
                    <select name="change_approver" class="form-select">
                        <option value="">(none)</option>
                        {% for u in users %}
                        <option value="{{ u.user_id }}" {% if item.change_approver == u.user_id %}selected{% endif %}>{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Drafted Date</label>
                    <input type="date" name="drafted_date" class="form-control" value="{{ item.drafted_date or '' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Approved Date</label>
                    <input type="date" name="approved_date" class="form-control" value="{{ item.approved_date or '' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Implemented Date</label>
                    <input type="date" name="implemented_date" class="form-control" value="{{ item.implemented_date or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="eco_description" class="form-control" rows="3">{{ item.eco_description or '' }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Change Detail</label>
                    <textarea name="change_detail" class="form-control" rows="3">{{ item.change_detail or '' }}</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/eco/{{ item.eco_number }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('part_number_select').addEventListener('change', function () {
    const rev = this.options[this.selectedIndex]?.getAttribute('data-revision') || '';
    document.getElementById('current_revision').value = rev || 'A';
});
</script>

{% endblock %}
