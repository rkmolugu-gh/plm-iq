{% extends "base.html" %}
{% block title %}New ECO - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/eco">ECOs</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New ECO</h5></div>
    <div class="card-body">
        <form method="POST" action="/eco/new">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">ECO Number</label>
                    <div class="input-group">
                        <input type="text" name="eco_number" id="eco_number" class="form-control" placeholder="Click Generate">
                        <button type="button" class="btn btn-outline-secondary" id="generateEcoNumber"><i class="bi bi-lightning"></i> Generate</button>
                    </div>
                </div>
                <div class="col-md-5">
                    <label class="form-label">ECO Title</label>
                    <input type="text" name="eco_title" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Part</label>
                    <select name="part_number" id="part_number_select" class="form-select">
                        <option value="">Select a part...</option>
                        {% for p in parts %}
                        <option value="{{ p.part_number }}" data-revision="{{ p.part_revision }}">{{ p.part_number }} Rev {{ p.part_revision }} — {{ p.part_name or p.part_number }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <hr>
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Current Rev</label>
                    <input type="text" name="current_revision" id="current_revision" class="form-control" value="A">
                </div>
                <div class="col-md-2">
                    <label class="form-label">New Rev</label>
                    <input type="text" name="new_revision" class="form-control" value="B">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="eco_status" class="form-select">
                        {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Change Type</label>
                    <select name="change_type" class="form-select">
                        <option value="">(none)</option>
                        {% for ct in change_types %}<option value="{{ ct }}">{{ ct }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">BOM Level</label>
                    <input type="number" name="affected_bom_level" class="form-control" min="0" value="0">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="eco_description" class="form-control" rows="3"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Change Detail</label>
                    <textarea name="change_detail" class="form-control" rows="3" placeholder="Describe changes using pipe-separated key-value pairs (e.g., Material: Steel -> Al| Weight: 100g -> 80g)"></textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/eco" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('generateEcoNumber').addEventListener('click', async function () {
    const input = document.getElementById('eco_number');
    try {
        const res = await fetch('/eco/api/next-number');
        const data = await res.json();
        input.value = data.eco_number || '';
    } catch (e) {
        input.value = '';
    }
});
document.getElementById('part_number_select').addEventListener('change', function () {
    const rev = this.options[this.selectedIndex]?.getAttribute('data-revision') || '';
    document.getElementById('current_revision').value = rev || 'A';
});
</script>

{% endblock %}
