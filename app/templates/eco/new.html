{% extends "base.html" %}
{% block title %}New ECO - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/eco">ECOs</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New ECO</h5></div>
    <div class="card-body">
        <form method="POST" action="/eco/new">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">ECO Number</label>
                    <input type="text" name="eco_number" class="form-control" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">ECO Title</label>
                    <input type="text" name="eco_title" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" placeholder="Select or enter part number">
                </div>
            </div>
            <hr>
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Current Rev</label>
                    <input type="text" name="current_revision" class="form-control" value="A">
                </div>
                <div class="col-md-2">
                    <label class="form-label">New Rev</label>
                    <input type="text" name="new_revision" class="form-control" value="B">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="eco_status" class="form-select">
                        {% for s in statuses %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Change Type</label>
                    <select name="change_type" class="form-select">
                        <option value="">(none)</option>
                        {% for ct in change_types %}
                        <option value="{{ ct }}" {% if form_change_type == ct %}selected{% endif %}>{{ ct }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">BOM Level</label>
                    <input type="number" name="affected_bom_level" class="form-control" min="0" value="0">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="eco_description" class="form-control" rows="3"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Change Detail</label>
                    <textarea name="change_detail" class="form-control" rows="3" placeholder="Describe changes using pipe-separated key-value pairs (e.g., Material: Steel -> Al| Weight: 100g -> 80g)"></textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/eco" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
