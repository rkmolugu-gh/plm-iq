{% extends "base.html" %}
{% block title %}Edit BOM Item #{{ item.id }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/bom">BOM</a></li>
        <li class="breadcrumb-item"><a href="/bom/{{ item.id }}">#{{ item.id }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit BOM Item #{{ item.id }}</h5></div>
    <div class="card-body">
        <form method="POST" action="/bom/{{ item.id }}/edit">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" value="{{ item.part_number }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Part Revision</label>
                    <input type="text" name="part_revision" class="form-control" value="{{ item.part_revision or '' }}">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Part Name</label>
                    <input type="text" name="part_name" class="form-control" value="{{ item.part_name or '' }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Level</label>
                    <input type="number" name="level" class="form-control" value="{{ item.level }}">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Qty</label>
                    <input type="number" name="qty" class="form-control" value="{{ item.qty }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">UOM</label>
                    <input type="text" name="uom" class="form-control" value="{{ item.uom or 'EA' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Parent Assembly</label>
                    <input type="text" name="parent_assembly" class="form-control" value="{{ item.parent_assembly or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">BOM Type</label>
                    <select name="bom_type" class="form-select">
                        {% for t in bom_types %}
                        <option value="{{ t }}" {% if item.bom_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Material Notes</label>
                    <input type="text" name="material_notes" class="form-control" value="{{ item.material_notes or '' }}">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/bom/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
