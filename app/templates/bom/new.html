{% extends "base.html" %}
{% block title %}New BOM Item - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/bom">BOM</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New BOM Item</h5></div>
    <div class="card-body">
        <form method="POST" action="/bom/new">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Part Revision</label>
                    <input type="text" name="part_revision" class="form-control">
                </div>
                <div class="col-md-5">
                    <label class="form-label">Part Name</label>
                    <input type="text" name="part_name" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Level</label>
                    <input type="number" name="level" class="form-control" value="0">
                </div>
                <div class="col-md-1">
                    <label class="form-label">Qty</label>
                    <input type="number" name="qty" class="form-control" value="1">
                </div>
                <div class="col-md-2">
                    <label class="form-label">UOM</label>
                    <input type="text" name="uom" class="form-control" value="EA">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Parent Assembly</label>
                    <input type="text" name="parent_assembly" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">BOM Type</label>
                    <select name="bom_type" class="form-select">
                        {% for t in bom_types %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Material Notes</label>
                    <input type="text" name="material_notes" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/bom" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
