{% extends "base.html" %}
{% block title %}Edit {{ item.manufacturer_name }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/aml">AML</a></li>
        <li class="breadcrumb-item"><a href="/aml/{{ item.id }}">{{ item.manufacturer_name }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Manufacturer Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/aml/{{ item.id }}/edit">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Manufacturer Name</label>
                    <input type="text" name="manufacturer_name" class="form-control" value="{{ item.manufacturer_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">MPN</label>
                    <input type="text" name="manufacturer_part_number" class="form-control" value="{{ item.manufacturer_part_number or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preferred</label>
                    <select name="preferred_flag" class="form-select">
                        <option value="No" {% if item.preferred_flag != 'Yes' %}selected{% endif %}>No</option>
                        <option value="Yes" {% if item.preferred_flag == 'Yes' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Lead Time (days)</label>
                    <input type="number" name="lead_time_days" class="form-control" value="{{ item.lead_time_days or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Unit Cost</label>
                    <input type="number" step="0.0001" name="unit_cost" class="form-control" value="{{ item.unit_cost or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quality Rating</label>
                    <input type="text" name="quality_rating" class="form-control" value="{{ item.quality_rating or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Compliance Status</label>
                    <input type="text" name="compliance_status" class="form-control" value="{{ item.compliance_status or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="3">{{ item.notes or '' }}</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/aml/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
