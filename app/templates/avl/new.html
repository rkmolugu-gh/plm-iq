{% extends "base.html" %}
{% block title %}New Vendor - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/avl">AVL</a></li>
        <li class="breadcrumb-item active">New</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-lg"></i> New Vendor Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/avl/new">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Part Number</label>
                    <input type="text" name="part_number" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Vendor Name</label>
                    <input type="text" name="vendor_name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">VPN</label>
                    <input type="text" name="vendor_part_number" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preferred</label>
                    <select name="preferred_flag" class="form-select">
                        {% for pf in settings.PREFERRED_FLAGS %}
                        <option value="{{ pf }}">{{ pf }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create</button>
                <a href="/avl" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
