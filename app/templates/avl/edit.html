{% extends "base.html" %}
{% block title %}Edit {{ item.vendor_name }} - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/avl">AVL</a></li>
        <li class="breadcrumb-item"><a href="/avl/{{ item.id }}">{{ item.vendor_name }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Vendor Entry</h5></div>
    <div class="card-body">
        <form method="POST" action="/avl/{{ item.id }}/edit">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Vendor Name</label>
                    <input type="text" name="vendor_name" class="form-control" value="{{ item.vendor_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">VPN</label>
                    <input type="text" name="vendor_part_number" class="form-control" value="{{ item.vendor_part_number or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Preferred</label>
                    <select name="preferred_flag" class="form-select">
                        <option value="No" {% if item.preferred_flag != 'Yes' %}selected{% endif %}>No</option>
                        <option value="Yes" {% if item.preferred_flag == 'Yes' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Unit Price</label>
                    <input type="number" step="0.0001" name="unit_price" class="form-control" value="{{ item.unit_price or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">MOQ</label>
                    <input type="number" name="min_order_qty" class="form-control" value="{{ item.min_order_qty or 1 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Lead Time (days)</label>
                    <input type="number" name="lead_time_days" class="form-control" value="{{ item.lead_time_days or 0 }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">ISO Certified</label>
                    <select name="iso_certified" class="form-select">
                        <option value="">No</option>
                        <option value="Yes" {% if item.iso_certified == 'Yes' %}selected{% endif %}>Yes</option>
                    </select>
                </div>
                <div class="col-md-9">
                    <label class="form-label">Payment Terms</label>
                    <input type="text" name="payment_terms" class="form-control" value="{{ item.payment_terms or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="3">{{ item.notes or '' }}</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a href="/avl/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
