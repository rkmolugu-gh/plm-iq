{% extends "base.html" %}
{% block title %}Edit {{ item.name }} - Documents - PLM-IQ{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/documents">Documents</a></li>
        {% for cid, cname in breadcrumb %}
        <li class="breadcrumb-item"><a href="/documents?parent_id={{ cid }}">{{ cname }}</a></li>
        {% endfor %}
        <li class="breadcrumb-item"><a href="/documents/{{ item.id }}">{{ item.name }}</a></li>
        <li class="breadcrumb-item active">Edit</li>
    </ol>
</nav>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Metadata — {{ item.name }}</h5>
        <form method="POST" action="/favorites/{% if is_favorite %}remove{% else %}add{% endif %}" class="d-inline">
            <input type="hidden" name="object_type" value="document">
            <input type="hidden" name="object_id" value="{{ item.id }}">
            <button type="submit" class="btn btn-outline-warning btn-sm" title="{% if is_favorite %}Remove from favorites{% else %}Add to favorites{% endif %}">
                <i class="bi bi-star{% if is_favorite %}-fill{% endif %}"></i>
            </button>
        </form>
    </div>
    <div class="card-body">
        <form method="POST" action="/documents/{{ item.id }}/edit">
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input type="text" name="title" id="title" class="form-control" value="{{ item.title or item.name }}">
            </div>
            <div class="row g-2">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="doc_category">Category</label>
                    <select name="doc_category" id="doc_category" class="form-select">
                        {% for c in categories %}<option value="{{ c }}" {% if c == item.doc_category %}selected{% endif %}>{{ c }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="doc_system">Source System</label>
                    <input type="text" name="doc_system" id="doc_system" class="form-control" value="{{ item.doc_system or '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="status">Status</label>
                <select name="status" id="status" class="form-select">
                    {% for s in statuses %}<option value="{{ s }}" {% if s == item.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea name="description" id="description" class="form-control" rows="3">{{ item.description or '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                <a href="/documents/{{ item.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
