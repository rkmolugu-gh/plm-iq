profile:
  id: plm-core
  name: PLM Core
  version: "1.0"
  inherits: []

graph:
  terminology:
    vertex: vertex
    edge: edge
    edge_type: edge_type
    vertex_property: vertex_property
    edge_property: edge_property
    traversal: traversal

  vertex_types:
    - id: vertex
      abstract: true
      properties:
        - {id: number, type: string, required: true, indexed: true, searchable: true}
        - {id: name, type: string, required: true, searchable: true}
        - {id: description, type: text, searchable: true}
        - {id: lifecycle_state, type: string, system: true, indexed: true}
        - {id: revision, type: string, system: true, indexed: true}

    - id: document
      label: DOCUMENT
      properties:
        - {id: document_number, type: string, required: true, indexed: true, searchable: true}
        - {id: document_class, type: string}
        - {id: file_name, type: string}
        - {id: mime_type, type: string}
        - {id: storage_key, type: string, system: true}

    - id: requirement
      label: REQUIREMENT
      properties:
        - {id: requirement_number, type: string, required: true, indexed: true, searchable: true}
        - {id: statement, type: text, required: true, searchable: true}

    - id: change
      label: CHANGE
      properties:
        - {id: change_number, type: string, required: true, indexed: true, searchable: true}
        - {id: reason, type: text}
        - {id: change_type, type: string}

  edge_types:
    - {id: documented_by, label: DOCUMENTED_BY, source: vertex, target: document, directed: true}
    - {id: satisfies, label: SATISFIES, source: vertex, target: requirement, directed: true}
    - {id: affected_by, label: AFFECTED_BY, source: vertex, target: change, directed: true}
    - {id: related_to, label: RELATED_TO, source: vertex, target: vertex, directed: true, symmetric: true}

lifecycle:
  id: standard
  states: [DRAFT, IN_REVIEW, RELEASED, OBSOLETE]
  transitions:
    - {from: DRAFT, to: IN_REVIEW, action: submit}
    - {from: IN_REVIEW, to: RELEASED, action: approve}
    - {from: RELEASED, to: OBSOLETE, action: obsolete}

revision:
  enabled: true
  default_format: "A,B,C,D"
  revision_on: [release, engineering_change]
  allow_unreleased_change: true

graph_queries:
  - id: vertex_documents
    start_vertex: vertex
    traversals: [{edge: DOCUMENTED_BY, direction: outgoing}]
  - id: vertex_requirements
    start_vertex: vertex
    traversals: [{edge: SATISFIES, direction: outgoing}]
  - id: vertex_changes
    start_vertex: vertex
    traversals: [{edge: AFFECTED_BY, direction: outgoing}]
  - id: downstream_impact
    start_vertex: vertex
    traversals: [{direction: outgoing, recursive: true}]
  - id: upstream_impact
    start_vertex: vertex
    traversals: [{direction: incoming, recursive: true}]

workflows:
  - id: vertex_release
    applies_to: vertex
    trigger: SUBMIT_FOR_RELEASE
    stages:
      - id: approval
        type: approval
        approvals_required: 1
        assignee: {type: role, value: APPROVER}
        on_approve: RELEASED
        on_reject: DRAFT

search:
  enabled: true
  indexed_vertex_types: [vertex, document, requirement, change]
  modes: [exact, fulltext, semantic, graph]

ai:
  enabled: true
  agents:
    - {id: impact_analysis, graph_queries: [downstream_impact, upstream_impact]}
    - {id: document_assistant, enabled: true}
  rag:
    enabled: true
    metadata: [tenant_id, vertex_id, vertex_type, revision, lifecycle_state]
