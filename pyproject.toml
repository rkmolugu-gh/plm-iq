[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plm-iq"
version = "0.1.0"
description = "PLM-IQ: Intelligent Product Lifecycle Management Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PLM-IQ Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.31.1,<1.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "python-dateutil>=2.9.0",
    "elasticsearch>=8.15.0",
    "pypdf>=4.3.1",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "Pillow>=10.0.0",
    "itsdangerous",
    "bcrypt",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
# Add your CLI entry points here
# plm-iq = "plm_iq.main:main"

# To run the dev server, use: uvicorn app.main:app --reload

[tool.hatch.build.targets.wheel]
packages = ["app", "db", "plmassistant", "aisearch"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["app", "db", "plmassistant"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.uv]
python-version = "3.10"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
