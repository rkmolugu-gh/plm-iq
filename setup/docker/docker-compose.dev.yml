# PLM-IQ development stack (api + infra). Runs on PostgreSQL (db service).
# Run via: setup/docker/build-run-term.bat dev build / dev run
services:
  api:
    build:
      context: ${PLMIQ_DOCKER}
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: ${PLMIQ_SETUP}/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://plmiq:plmiq@db:5432/plmiq}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      TENANT_REQUIRE_SUBDOMAIN: ${TENANT_REQUIRE_SUBDOMAIN:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # local source tree -> /plm-iq (live code, no rebuild needed for edits)
      - ${PLMIQ_ROOT}:/plm-iq
      # local env files -> /plm-iq/setup in the container
      - ${PLMIQ_SETUP}/.env:/plm-iq/setup/.env:ro
      - ${PLMIQ_SETUP}/.env.dev.example:/plm-iq/setup/.env.dev.example:ro
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      gitea:
        condition: service_healthy
      smtp:
        condition: service_healthy

  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plmiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plmiq}
      POSTGRES_DB: ${POSTGRES_DB:-plmiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${POSTGRES_DATA_DIR:-${PLMIQ_ROOT}/container-shared-volume/postgres}:/var/lib/postgresql/data"
      - "${PLMIQ_SETUP}/postgres-init:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gitea:
    image: gitea/gitea:${GITEA_VERSION:-1.22}
    restart: unless-stopped
    environment:
      USER_UID: "${GITEA_UID:-1000}"
      USER_GID: "${GITEA_GID:-1000}"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db
      GITEA__database__PORT: "5432"
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER:-platformadmin@plm-iq.site}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-19691969}
      GITEA__server__ROOT_URL: ${GITEA_BASE_URL:-http://localhost:3000}/
      GITEA__server__SSH_PORT: "${GITEA_SSH_PORT:-2222}"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - "${GITEA_DATA_DIR:-${PLMIQ_ROOT}/container-shared-volume/gitea}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${ES_PASSWORD:-elastic}"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - "${ELASTICSEARCH_DATA_DIR:-${PLMIQ_ROOT}/container-shared-volume/elasticsearch}:/usr/share/elasticsearch/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  smtp:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - "${MAILPIT_DATA_DIR:-${PLMIQ_ROOT}/container-shared-volume/mailpit}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-platformadmin@plm-iq.site}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-19691969}
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "${PGADMIN_UI_PORT:-5050}:80"
    volumes:
      - "${PGADMIN_DATA_DIR:-${PLMIQ_ROOT}/container-shared-volume/pgadmin}:/var/lib/pgadmin"
      # auto-register the plm-iq server connection on startup
      - "${PLMIQ_DOCKER}pgadmin-servers.json:/pgadmin4/servers.json:ro"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/misc/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-plm-iq-network}
