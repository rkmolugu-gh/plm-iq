



<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body class="edition-none">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">PLM-IQ</span>
        
      </a>
      
      <nav class="topnav" aria-label="Primary">
        <span class="topnav-item is-disabled">Parts</span>
        <span class="topnav-item is-disabled">Documents</span>
        <span class="topnav-item is-disabled">Changes</span>
        <span class="topnav-item is-disabled">Search</span>
      </nav>
      
    </div>
  </header>

  <div class="shell no-nav">
    
    <main class="page">
<section class="auth-wrap">
  <form class="auth-card" method="post" action="/signin">
    
    <p class="hero-eyebrow">PLM-IQ</p>
    
    <h1 class="auth-title">Sign in</h1>

    <label class="auth-label">
      Tenant
      <input class="auth-input" type="text" name="tenant" value=""
             placeholder="your-organization" autocomplete="organization">
    </label>

    <label class="auth-label">
      Username or email
      <input class="auth-input" type="text" name="username" autocomplete="username">
    </label>

    <label class="auth-label">
      Password
      <input class="auth-input" type="password" name="password" autocomplete="current-password">
    </label>

    <label class="auth-remember">
      <input type="checkbox" name="remember"> Keep me signed in
    </label>

    <button class="btn btn-primary auth-submit" type="submit">Sign in</button>

    <p class="auth-note">
      Demo mode &mdash; any credentials continue to the sample workspace dashboard.
    </p>
  </form>
</section>
</main>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      
      <span>PLM-IQ</span>
      
      <span>Foundation UI &mdash; API plumbing coming later</span>
    </div>
  </footer>
</body>
</html>
